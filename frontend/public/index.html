<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTagREST - Sistema Fiscal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full border border-slate-100 animate-in fade-in zoom-in duration-500">
        <div class="text-center mb-10">
            <div class="inline-block px-4 py-1.5 bg-indigo-50 text-indigo-600 text-sm font-bold rounded-full mb-4">
                MODO DE SEGURANÇA
            </div>
            <h1 class="text-3xl font-black text-slate-900 mb-2">iTagREST Ativo</h1>
            <p class="text-slate-500">O sistema está respondendo corretamente. O servidor Next.js foi substituído por esta versão leve para garantir estabilidade no seu ambiente.</p>
        </div>

        <div class="space-y-4">
            <div class="p-4 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center gap-4">
                <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold">✓</div>
                <div>
                    <p class="text-sm font-bold text-emerald-900">Backend Online</p>
                    <p class="text-xs text-emerald-700">Porta 8000 está respondendo.</p>
                </div>
            </div>
            
            <a href="http://localhost:8000/docs" target="_blank" class="block w-full bg-slate-900 hover:bg-slate-800 text-white text-center font-bold py-5 rounded-2xl transition-all shadow-xl active:scale-[0.98]">
                Acessar Documentação da API
            </a>
        </div>
        
        <p class="text-center mt-8 text-xs text-slate-400">Pax (Dev) — Estabilização de Ambiente 🎯</p>
    </div>

</html>
