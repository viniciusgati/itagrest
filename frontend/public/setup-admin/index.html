<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTagREST - Primeiro Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div id="setup-card" class="bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full border border-slate-100">
        <div class="text-center mb-10">
            <div class="inline-block px-4 py-1.5 bg-indigo-50 text-indigo-600 text-sm font-bold rounded-full mb-4">
                PRIMEIRO ACESSO
            </div>
            <h1 class="text-3xl font-black text-slate-900 mb-2">Seja bem-vindo!</h1>
            <p class="text-slate-500">Defina suas credenciais de administrador para começar.</p>
        </div>

        <form id="setup-form" class="space-y-5">
            <div id="error-msg" class="hidden bg-red-50 text-red-600 p-4 rounded-2xl text-sm font-medium border border-red-100"></div>

            <div class="space-y-1.5">
                <label class="text-sm font-bold text-slate-700 ml-1">Nome Completo</label>
                <div class="relative">
                    <input required type="text" id="full_name" placeholder="Ex: João Silva" class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-300 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-700 ml-1">Usuário</label>
                    <input required type="text" id="username" placeholder="admin" class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-300 transition-all">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-700 ml-1">E-mail</label>
                    <input required type="email" id="email" placeholder="admin@restaurante.com" class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-300 transition-all">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-sm font-bold text-slate-700 ml-1">Senha</label>
                <input required type="password" id="password" placeholder="••••••••" class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-300 transition-all">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-5 rounded-2xl transition-all shadow-xl active:scale-[0.98] flex items-center justify-center gap-2 mt-4">
                Finalizar Configuração
            </button>
        </form>
    </div>

    <script>
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-msg');
            
            btn.disabled = true;
            btn.innerText = 'Processando...';
            errorDiv.classList.add('hidden');

            const payload = {
                full_name: document.getElementById('full_name').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('http://localhost:8000/api/v1/setup/setup-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('setup-card').innerHTML = `
                        <div class="text-center">
                            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <div class="text-emerald-600 text-4xl font-bold">✓</div>
                            </div>
                            <h1 class="text-3xl font-bold text-slate-900 mb-4">Tudo Pronto!</h1>
                            <p class="text-slate-600 mb-8">Admin configurado. Agora você pode acessar o sistema.</p>
                            <a href="/" class="block w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg">Ir para o Dashboard</a>
                        </div>
                    `;
                } else {
                    const data = await response.json();
                    errorDiv.innerText = data.detail || 'Erro ao configurar.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Erro ao conectar com o servidor.';
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Finalizar Configuração';
            }
        });
    </script>
</body>
</html>
